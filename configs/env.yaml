# ══════════════════════════════════════════════════════════════════════════════
# KneeVision-AI: Environment Configuration
# ══════════════════════════════════════════════════════════════════════════════
#
# This file holds ALL environment-specific settings (paths, credentials,
# hardware). It is in .gitignore — never commit real credentials here.
# Copy this to env.yaml and fill in your values.
#
# Override any value at runtime via environment variables:
#   KNEEVISION_DATA_DIR=/mnt/ssd/rsna python scripts/04_train_5fold_cv.py
# ══════════════════════════════════════════════════════════════════════════════

# ── Repository & workspace ───────────────────────────────────────────────────
project:
  name: "rsna-knee-abnormality-detection"
  repo_root: ""          # auto-resolved if empty: parent of this file's directory
  conda_env: "rsna-knee" # name of the conda env (used by docs as reference only)

# ── Local dataset location ───────────────────────────────────────────────────
data:
  # Raw RSNA competition data (downloaded via `kaggle competitions download`)
  data_dir: ""           # e.g. ~/datasets/rsna-knee-abnormality-detection

# ── Checkpoints ──────────────────────────────────────────────────────────────
checkpoints:
  local_dir: "./checkpoints"

# ── Kaggle API (used by upload/submit scripts) ────────────────────────────────
# Alternatively set env vars KAGGLE_USERNAME and KAGGLE_KEY.
kaggle:
  username: ""           # your Kaggle username
  dataset_slug: ""       # e.g.  <username>/rsna-knee-kneevision-weights-v2
  kernel_slug: ""        # e.g.  <username>/kneevision-ai-rsna-submission

# ── Hardware ─────────────────────────────────────────────────────────────────
hardware:
  num_workers: 8         # DataLoader workers (set to 0 for Windows/debug)
  pin_memory: true
